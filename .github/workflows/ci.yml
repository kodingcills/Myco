name: CI

on:
  push:
    branches: [main]
  # labeled/unlabeled: adding `tier-2` (or `full-ci`) to a PR starts a new run, which
  # cancels the narrower one, so a label added after a targeted run still forces the
  # full suite before merge (test audit, docs/ci.md "Targeted CI").
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege (TIF-241): no job writes to the repo, PRs, or checks via the API.
# actions/cache and actions/upload-artifact use the runner's own Actions runtime
# token, not GITHUB_TOKEN scopes, so they need no extra permission here.
permissions:
  contents: read

# A newer push to the same PR cancels its superseded run. Pushes to main get a
# per-run group (github.run_id) and cancel-in-progress false, so a main run is
# never cancelled or displaced by another main push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Test audit (TIF-265 follow-up): decides which steps of each job run, from the PR's
  # changed paths, labels and stated tier. Required jobs never skip at the job level:
  # they always start, report under their unchanged names, and run everything when this
  # job fails or is skipped (fail safe). Path classes: scripts/ci-plan.py, docs/ci.md.
  plan:
    name: ci plan (path classes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      linux_path: ${{ steps.plan.outputs.linux_path }}
      m2: ${{ steps.plan.outputs.m2 }}
      launcher: ${{ steps.plan.outputs.launcher }}
      doc_tests: ${{ steps.plan.outputs.doc_tests }}
      smoke: ${{ steps.plan.outputs.smoke }}
      scanners: ${{ steps.plan.outputs.scanners }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci-plan.py

  # TIF-206: a key must never reach the repo. Scans only the commits this PR or push
  # adds (older history predates the scanner), with findings REDACTED in the log.
  # Allow a reviewed synthetic fixture inline with a `gitleaks:allow` comment.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan new commits
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "scanning $range"
          /tmp/gitleaks git --redact --no-banner --verbose --log-opts="$range" .

  # M2-14 (plan label, Linear pending): enforce the workflow rules in docs/ci.md and
  # docs/security/public-release-safety.md: no pull_request_target, GitHub-hosted runners
  # only, no write token on workflow_run, read-only top-level permissions, no job
  # widening them, and every action pinned to a full SHA with a version comment.
  ci-hygiene:
    name: ci hygiene (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML (hash pinned)
        run: |
          pip install --require-hashes --only-binary :all: --no-deps -r scripts/ci-hygiene-requirements.txt
      - name: Check workflows
        run: python scripts/ci-hygiene-check.py
      - name: Test the checker and the history scan
        run: python -m unittest discover -s test/ci-hygiene -v

  check:
    needs: plan
    # Never skipped at the job level: a skipped matrix job reports as
    # "check (${{ matrix.os }})", which would leave the required checks pending.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # TIF-256: from 2026-11-23 to 11-25, macOS runs of this job took at most 3.5 min
    # once a runner had it (p50 1.8). 15 min fails a hang loudly, as "timed out" in
    # the step that hung. It does not cover queue time: a job no runner picks up is
    # cancelled by GitHub; re-run it by hand (docs/ci.md, TIF-256).
    timeout-minutes: 15
    steps:
      - name: CI plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          PLAN_LAUNCHER: ${{ needs.plan.outputs.launcher }}
          PLAN_SCANNERS: ${{ needs.plan.outputs.scanners }}
        run: |
          # Fail safe: only a successful plan naming a known narrow mode narrows anything.
          # `case` matches the whole value; `grep -x` would accept any one line of it.
          mode="$PLAN_MODE"
          case "$mode" in full | targeted | docs) known=yes ;; *) known=no ;; esac
          if [ "$PLAN_RESULT" != "success" ] || [ "$known" != yes ]; then
            echo "plan job '$PLAN_RESULT' (mode '$mode'): running the full suite (fail safe)"
            mode=full
          fi
          # A narrow mode must run the directory-scanning guards; with none listed, it cannot.
          if [ "$mode" != full ] && [ -z "$PLAN_SCANNERS" ]; then
            echo "plan mode '$mode' lists no directory-scanning tests: running the full suite (fail safe)"
            mode=full
          fi
          launcher=true
          if [ "$PLAN_LAUNCHER" = "false" ]; then launcher=false; fi
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "LAUNCHER=$launcher" >> "$GITHUB_ENV"
          echo "mode: $mode, launcher: $launcher"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # targeted mode diffs against the PR base (`vitest run --changed`).
          fetch-depth: ${{ env.MODE == 'targeted' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: env.MODE != 'docs'
        run: pnpm typecheck
      - name: Lint
        if: env.MODE != 'docs'
        run: pnpm lint
      - name: Test
        if: env.MODE == 'full'
        run: pnpm test
      - name: Test (targeted, files related to the change)
        if: env.MODE == 'targeted'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec vitest run --changed "$BASE_SHA" --passWithNoTests --exclude test/discovery/s0-live-launcher.test.ts
      # `pnpm test` runs the launcher test alone in a forked pool; `--changed` excludes it,
      # so a narrow mode reruns it the same way when test/discovery/ changed or it is a
      # directory-scanning test (it lists its run directory, so today: always).
      - name: Test (s0 launcher, forked)
        if: env.MODE != 'full' && env.LAUNCHER == 'true'
        run: pnpm exec vitest run --pool=forks --no-file-parallelism test/discovery/s0-live-launcher.test.ts
      # Directory-scanning guards (grader independence, hidden split, home paths, ...)
      # never import what they scan, so `--changed` cannot select them: always run them.
      - name: Test (core smoke, directory-scanning tests and doc tests)
        if: env.MODE != 'full'
        env:
          SMOKE: ${{ needs.plan.outputs.smoke }}
          SCANNERS: ${{ needs.plan.outputs.scanners }}
          DOC_TESTS: ${{ needs.plan.outputs.doc_tests }}
        run: |
          # shellcheck disable=SC2086 # space-separated file lists, written by scripts/ci-plan.py
          pnpm exec vitest run $SMOKE $SCANNERS $DOC_TESTS
      - name: Schema validate
        if: env.MODE == 'targeted'
        run: pnpm schema-validate
      - name: Build
        if: env.MODE != 'docs'
        run: pnpm build

  agent:
    name: myco-agent tests (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # TIF-256: macOS runs took at most 0.9 min once a runner had them; see `check`.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: CI plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          # Fail safe: skip only on a successful plan naming a narrow mode; a failed or
          # skipped plan, or an empty or unknown mode, runs the tests.
          case "$PLAN_MODE" in targeted | docs) narrow=yes ;; *) narrow=no ;; esac
          if [ "$PLAN_RESULT" = "success" ] && [ "$narrow" = yes ]; then
            echo "RUN=false" >> "$GITHUB_ENV"
            echo "plan mode '$PLAN_MODE': agent/ is untouched (it is a full-suite path class); not run"
          else
            echo "RUN=true" >> "$GITHUB_ENV"
          fi
      - name: Install
        if: env.RUN == 'true'
        run: pip install -e . pytest
      - name: Test
        if: env.RUN == 'true'
        run: pytest -v

  # TIF-119: the in-guest agent's file-grant confinement (RT-015 read, RT-017 write)
  # is `cfg(target_os = "linux")`, so on the macOS dev host those tests compile to
  # nothing and "cargo test" passes with them never run. This job runs them on Linux
  # and fails if the file_grant test count is zero, so the gap cannot silently return.
  runtime-agent-linux:
    name: runtime guest agent tests (ubuntu-latest)
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: CI plan
        working-directory: .
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          # Fail safe: skip only on a successful plan naming a narrow mode; a failed or
          # skipped plan, or an empty or unknown mode, runs the tests.
          case "$PLAN_MODE" in targeted | docs) narrow=yes ;; *) narrow=no ;; esac
          if [ "$PLAN_RESULT" = "success" ] && [ "$narrow" = yes ]; then
            echo "RUN=false" >> "$GITHUB_ENV"
            echo "plan mode '$PLAN_MODE': runtime/ is untouched (it is a full-suite path class); not run"
          else
            echo "RUN=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - name: Native deps (xa11y-linux links libxkbcommon)
        if: env.RUN == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config
      # Pinned to a commit on dtolnay/rust-toolchain's master branch (its README asks
      # SHA pins to come from master); with a SHA the toolchain must be named.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master branch commit
        if: env.RUN == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RUN == 'true'
        with:
          workspaces: runtime
      - name: Test myco-rt-agent
        if: env.RUN == 'true'
        # pipefail: a job-level `defaults.run` makes the shell `bash -e` without
        # pipefail, so `| tee` swallowed a compile failure (first run of this job).
        run: |
          set -o pipefail
          cargo test -p myco-rt-agent 2>&1 | tee /tmp/agent-test.log
      - name: Confinement tests actually ran
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          n=$(grep -cE '^test file_grant::.* \.\.\. ok$' /tmp/agent-test.log || true)
          echo "file_grant tests passed: $n"
          [ "$n" -gt 0 ] || { echo "::error::zero file_grant tests ran on Linux (TIF-119)"; exit 1; }
      # RT-017: the agent/wire round trip (transport <-> real agent) is Linux-only
      # too, as is RT-015's read over the channel; core + mcp hold the Session and
      # MCP-surface tests. Build the agent explicitly so the transport tests never
      # spawn a stale cached binary.
      - name: Test transport (real agent over the wire), core, mcp
        if: env.RUN == 'true'
        run: |
          set -o pipefail
          cargo build -p myco-rt-agent
          cargo test -p myco-rt-transport -p myco-rt-core -p myco-rt-mcp 2>&1 | tee /tmp/host-test.log
      - name: Wire round trip actually ran
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          for t in file_write_over_control_channel_round_trips_through_the_agent agent_refuses_an_oversize_write_on_its_own file_read_over_control_channel_requires_grant; do
            grep -qE "^test tests::$t \.\.\. ok$" /tmp/host-test.log || { echo "::error::$t did not run and pass on Linux"; exit 1; }
          done

  # TIF-273 (M2-11): the M2 scorecard check and the process gates the M2 plan §2.2
  # keeps as CI checks instead of scorecard rows: schema validity of every committed
  # M2 evidence pack, a cause on every non-verified row (with a harness class), and the
  # guest load gate record. Host only: no VM, no model, no secrets. Not a required check.
  m2-scorecard:
    name: m2 evidence and scorecard
    needs: plan
    # Not required: skipped at the job level when the plan says no M2 path changed.
    # Fail safe: runs unless a successful plan names a narrow mode and says m2 is false.
    if: ${{ !cancelled() && (needs.plan.result != 'success' || (needs.plan.outputs.mode != 'targeted' && needs.plan.outputs.mode != 'docs') || needs.plan.outputs.m2 != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Evidence gates (every committed m2-* pack)
        run: pnpm exec tsx scripts/m2-evidence-check.ts --all
      - name: M2 scorecard check
        run: python3 scripts/m2-scorecard-check.py
      - name: Checker tests (fixture packs, every failure mode)
        run: pnpm exec vitest run test/m2

  # Track L2: strict per-trial isolation (strict-linux-ns). Ubuntu 24.04 restricts
  # unprivileged user namespaces through AppArmor, so the job lifts that sysctl first;
  # MYCO_STRICT_NS_REQUIRED=1 makes the namespace suite FAIL instead of skip when the
  # backend cannot start. Runs as the unprivileged runner user. No VM, no model, no secrets.
  strict-isolation:
    name: strict isolation (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYCO_STRICT_NS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Strict isolation tests (namespaces; must not skip)
        run: pnpm exec vitest run test/isolation

  # TIF-269 (M2-06): the Linux path an outsider can run. A real headless
  # LibreOffice Calc is driven by a scripted agent; Myco's oracle reads the saved
  # workbook and must return verified / refuted / uncertain as each scenario
  # expects, including the false completion (agent says done, file disagrees).
  # No VM, no model, no secrets. MYCO_LINUX_PATH_REQUIRED=1 makes the real-Calc
  # suite fail instead of skip if LibreOffice or Python-UNO is missing.
  linux-path:
    name: linux path (ubuntu-latest)
    needs: plan
    # Not required: skipped at the job level unless a Linux-path or init path changed.
    # Fail safe: runs unless a successful plan names a narrow mode and says linux_path is false.
    if: ${{ !cancelled() && (needs.plan.result != 'success' || (needs.plan.outputs.mode != 'targeted' && needs.plan.outputs.mode != 'docs') || needs.plan.outputs.linux_path != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYCO_PYTHON: /usr/bin/python3
      MYCO_LINUX_PATH_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install LibreOffice Calc and Python-UNO
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno
      - name: Prerequisites
        run: pnpm myco-linux --check
      - name: Linux path tests (real Calc; must not skip)
        run: pnpm exec vitest run test/linux
      - name: Demo (every scenario must produce its expected verdict)
        run: pnpm myco-linux --demo --out "$RUNNER_TEMP/myco-linux"
      # TIF-265 track D: `myco init` (desktop check on) writes the project configs, real Calc
      # edits the file under the configured evidence root, and a scripted MCP client gets
      # verified / refuted through the written .mcp.json and .codex/config.toml. Must not skip.
      - name: myco init end to end (real Calc, written config, scripted MCP client)
        env:
          MYCO_INIT_E2E_TRANSCRIPT: ${{ runner.temp }}/myco-linux/init-e2e.txt
        run: pnpm exec vitest run test/init/init-linux-e2e.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-path-runs
          path: ${{ runner.temp }}/myco-linux
          if-no-files-found: ignore

  # Runs both verdict fixture sizes on main pushes and PRs labelled `perf`.
  # The hosted 10k check compares the median against calibrated runner caps.
  # The strict local gate enforces a 150 ms maximum at both sizes
  # (MYCO_VIEWER_STRICT_BUDGET=1). See viewer/PERF.md.
  # Noisy-neighbour timing variance on hosted runners shifts the whole sample
  # distribution bimodally (see docs/coordination/foundry-state.md): bad runs sit
  # 2.1-2.7x over baseline, indistinguishable from a real regression by any
  # median threshold. So this gate runs post-merge on main and on PRs labelled
  # `perf`, where a timing failure is actionable; docs-only PRs are not gated on
  # a runner noise race. The darwin 10k baseline (339.1 ms) is the median of 94
  # macos-latest job medians on unchanged viewer code; a budget miss re-measures
  # once and fails only if both attempts miss (viewer/PERF.md). A 1.5x slowdown
  # on a baseline-speed runner (508.7 ms) still fails the 457.8 ms limit.
  viewer-perf:
    name: viewer verdict budget (${{ matrix.os }})
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'perf')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      MYCO_VIEWER_BUDGET_REPORT: ${{ github.workspace }}/verdict-budget.ndjson
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium (headless shell)
        run: pnpm --filter viewer exec playwright install --only-shell ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Build viewer
        run: pnpm --filter viewer build
      - name: Verdict budget
        run: pnpm --filter viewer e2e verdict-budget.pw.ts
      - name: Report samples
        if: always()
        run: |
          echo '### Verdict budget samples (${{ matrix.os }})' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$MYCO_VIEWER_BUDGET_REPORT" ]; then
            node -e 'for (const l of require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n")) { const r = JSON.parse(l); console.log(`- ${r.steps} steps, attempt ${r.attempt ?? 1}, N=${r.samples.length}: median ${r.median.toFixed(1)}, p95 ${r.p95.toFixed(1)}, max ${r.max.toFixed(1)} ms`); }' "$MYCO_VIEWER_BUDGET_REPORT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "raw samples (ms), one JSON line per size and attempt (a retry line carries its note):"
            cat "$MYCO_VIEWER_BUDGET_REPORT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict-budget-${{ matrix.os }}
          path: verdict-budget.ndjson
          if-no-files-found: ignore
