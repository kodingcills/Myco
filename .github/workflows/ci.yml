name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (TIF-241): no job writes to the repo, PRs, or checks via the API.
# actions/cache and actions/upload-artifact use the runner's own Actions runtime
# token, not GITHUB_TOKEN scopes, so they need no extra permission here.
permissions:
  contents: read

# A newer push to the same PR cancels its superseded run. Pushes to main get a
# per-run group (github.run_id) and cancel-in-progress false, so a main run is
# never cancelled or displaced by another main push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # TIF-206: a key must never reach the repo. Scans only the commits this PR or push
  # adds (older history predates the scanner), with findings REDACTED in the log.
  # Allow a reviewed synthetic fixture inline with a `gitleaks:allow` comment.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan new commits
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "scanning $range"
          /tmp/gitleaks git --redact --no-banner --verbose --log-opts="$range" .

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # TIF-256: from 2026-11-23 to 11-25, macOS runs of this job took at most 3.5 min
    # once a runner had it (p50 1.8). 15 min fails a hang loudly, as "timed out" in
    # the step that hung. It does not cover queue time: a job no runner picks up is
    # cancelled by GitHub; re-run it by hand (docs/ci.md, TIF-256).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  agent:
    name: myco-agent tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # TIF-256: macOS runs took at most 0.9 min once a runner had them; see `check`.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest -v

  # TIF-119: the in-guest agent's file-grant confinement (RT-015 read, RT-017 write)
  # is `cfg(target_os = "linux")`, so on the macOS dev host those tests compile to
  # nothing and "cargo test" passes with them never run. This job runs them on Linux
  # and fails if the file_grant test count is zero, so the gap cannot silently return.
  runtime-agent-linux:
    name: runtime guest agent tests (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Native deps (xa11y-linux links libxkbcommon)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config
      # Pinned to a commit on dtolnay/rust-toolchain's master branch (its README asks
      # SHA pins to come from master); with a SHA the toolchain must be named.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master branch commit
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtime
      - name: Test myco-rt-agent
        # pipefail: a job-level `defaults.run` makes the shell `bash -e` without
        # pipefail, so `| tee` swallowed a compile failure (first run of this job).
        run: |
          set -o pipefail
          cargo test -p myco-rt-agent 2>&1 | tee /tmp/agent-test.log
      - name: Confinement tests actually ran
        run: |
          set -euo pipefail
          n=$(grep -cE '^test file_grant::.* \.\.\. ok$' /tmp/agent-test.log || true)
          echo "file_grant tests passed: $n"
          [ "$n" -gt 0 ] || { echo "::error::zero file_grant tests ran on Linux (TIF-119)"; exit 1; }
      # RT-017: the agent/wire round trip (transport <-> real agent) is Linux-only
      # too, as is RT-015's read over the channel; core + mcp hold the Session and
      # MCP-surface tests. Build the agent explicitly so the transport tests never
      # spawn a stale cached binary.
      - name: Test transport (real agent over the wire), core, mcp
        run: |
          set -o pipefail
          cargo build -p myco-rt-agent
          cargo test -p myco-rt-transport -p myco-rt-core -p myco-rt-mcp 2>&1 | tee /tmp/host-test.log
      - name: Wire round trip actually ran
        run: |
          set -euo pipefail
          for t in file_write_over_control_channel_round_trips_through_the_agent agent_refuses_an_oversize_write_on_its_own file_read_over_control_channel_requires_grant; do
            grep -qE "^test tests::$t \.\.\. ok$" /tmp/host-test.log || { echo "::error::$t did not run and pass on Linux"; exit 1; }
          done

  # Runs both verdict fixture sizes on main pushes and PRs labelled `perf`.
  # The hosted 10k check compares the median against calibrated runner caps.
  # The strict local gate enforces a 150 ms maximum at both sizes
  # (MYCO_VIEWER_STRICT_BUDGET=1). See viewer/PERF.md.
  # Noisy-neighbour timing variance on hosted runners shifts the whole sample
  # distribution bimodally (see docs/coordination/foundry-state.md): bad runs sit
  # 2.1-2.7x over baseline, indistinguishable from a real regression by any
  # median threshold. So this gate runs post-merge on main and on PRs labelled
  # `perf`, where a timing failure is actionable; docs-only PRs are not gated on
  # a runner noise race. The darwin 10k baseline (339.1 ms) is the median of 94
  # macos-latest job medians on unchanged viewer code; a budget miss re-measures
  # once and fails only if both attempts miss (viewer/PERF.md). A 1.5x slowdown
  # on a baseline-speed runner (508.7 ms) still fails the 457.8 ms limit.
  viewer-perf:
    name: viewer verdict budget (${{ matrix.os }})
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'perf')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      MYCO_VIEWER_BUDGET_REPORT: ${{ github.workspace }}/verdict-budget.ndjson
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium (headless shell)
        run: pnpm --filter viewer exec playwright install --only-shell ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Build viewer
        run: pnpm --filter viewer build
      - name: Verdict budget
        run: pnpm --filter viewer e2e verdict-budget.pw.ts
      - name: Report samples
        if: always()
        run: |
          echo '### Verdict budget samples (${{ matrix.os }})' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$MYCO_VIEWER_BUDGET_REPORT" ]; then
            node -e 'for (const l of require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n")) { const r = JSON.parse(l); console.log(`- ${r.steps} steps, attempt ${r.attempt ?? 1}, N=${r.samples.length}: median ${r.median.toFixed(1)}, p95 ${r.p95.toFixed(1)}, max ${r.max.toFixed(1)} ms`); }' "$MYCO_VIEWER_BUDGET_REPORT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "raw samples (ms), one JSON line per size and attempt (a retry line carries its note):"
            cat "$MYCO_VIEWER_BUDGET_REPORT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict-budget-${{ matrix.os }}
          path: verdict-budget.ndjson
          if-no-files-found: ignore
