name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  agent:
    name: myco-agent tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest -v

  # TIF-119: the in-guest agent's file-grant confinement (RT-015 read, RT-017 write)
  # is `cfg(target_os = "linux")`, so on the macOS dev host those tests compile to
  # nothing and "cargo test" passes with them never run. This job runs them on Linux
  # and fails if the file_grant test count is zero, so the gap cannot silently return.
  runtime-agent-linux:
    name: runtime guest agent tests (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - name: Native deps (xa11y-linux links libxkbcommon)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - name: Test myco-rt-agent
        # pipefail: a job-level `defaults.run` makes the shell `bash -e` without
        # pipefail, so `| tee` swallowed a compile failure (first run of this job).
        run: |
          set -o pipefail
          cargo test -p myco-rt-agent 2>&1 | tee /tmp/agent-test.log
      - name: Confinement tests actually ran
        run: |
          set -euo pipefail
          n=$(grep -cE '^test file_grant::.* \.\.\. ok$' /tmp/agent-test.log || true)
          echo "file_grant tests passed: $n"
          [ "$n" -gt 0 ] || { echo "::error::zero file_grant tests ran on Linux (TIF-119)"; exit 1; }
      # RT-017: the agent/wire round trip (transport <-> real agent) is Linux-only
      # too, as is RT-015's read over the channel; core + mcp hold the Session and
      # MCP-surface tests. Build the agent explicitly so the transport tests never
      # spawn a stale cached binary.
      - name: Test transport (real agent over the wire), core, mcp
        run: |
          set -o pipefail
          cargo build -p myco-rt-agent
          cargo test -p myco-rt-transport -p myco-rt-core -p myco-rt-mcp 2>&1 | tee /tmp/host-test.log
      - name: Wire round trip actually ran
        run: |
          set -euo pipefail
          for t in file_write_over_control_channel_round_trips_through_the_agent agent_refuses_an_oversize_write_on_its_own file_read_over_control_channel_requires_grant; do
            grep -qE "^test tests::$t \.\.\. ok$" /tmp/host-test.log || { echo "::error::$t did not run and pass on Linux"; exit 1; }
          done

  # Runs both verdict fixture sizes on main pushes and PRs labelled `perf`.
  # The hosted 10k check compares the median against calibrated runner caps.
  # The strict local gate enforces a 150 ms maximum at both sizes
  # (MYCO_VIEWER_STRICT_BUDGET=1). See viewer/PERF.md.
  # Noisy-neighbour timing variance on hosted runners shifts the whole sample
  # distribution bimodally (see docs/coordination/foundry-state.md): bad runs sit
  # 2.1-2.7x over baseline, indistinguishable from a real regression by any
  # median threshold. So this gate runs post-merge on main and on PRs labelled
  # `perf`, where a timing failure is actionable; docs-only PRs are not gated on
  # a runner noise race. Thresholds are unchanged and still catch a 2x slowdown
  # (630.8 ms vs hardMedian 580 / relative limit 425.8 on darwin).
  viewer-perf:
    name: viewer verdict budget (${{ matrix.os }})
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'perf')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      MYCO_VIEWER_BUDGET_REPORT: ${{ github.workspace }}/verdict-budget.ndjson
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium (headless shell)
        run: pnpm --filter viewer exec playwright install --only-shell ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Build viewer
        run: pnpm --filter viewer build
      - name: Verdict budget
        run: pnpm --filter viewer e2e verdict-budget.pw.ts
      - name: Report samples
        if: always()
        run: |
          echo '### Verdict budget samples (${{ matrix.os }})' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$MYCO_VIEWER_BUDGET_REPORT" ]; then
            node -e 'for (const l of require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n")) { const r = JSON.parse(l); console.log(`- ${r.steps} steps, N=${r.samples.length}: median ${r.median.toFixed(1)}, p95 ${r.p95.toFixed(1)}, max ${r.max.toFixed(1)} ms`); }' "$MYCO_VIEWER_BUDGET_REPORT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "raw samples (ms), one JSON line per size:"
            cat "$MYCO_VIEWER_BUDGET_REPORT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-budget-${{ matrix.os }}
          path: verdict-budget.ndjson
          if-no-files-found: ignore
