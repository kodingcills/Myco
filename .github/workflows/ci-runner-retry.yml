# TIF-256: GitHub sometimes cancels a macos-latest job after 15-20 min in the queue
# with "The job was not acquired by Runner of type hosted even after multiple
# attempts" (macOS arm64 capacity). The job ran no step, so nothing in this repo
# hung, and a timeout-minutes cannot catch it: queue time is not job time. This
# workflow re-runs such a run's failed jobs, at most twice (3 attempts in all), and
# only when every failed or cancelled job is a no-runner job and, for a PR, the run
# is still the PR's newest. The checks are in .github/scripts/rerun-unacquired.sh.
#
# Why workflow_run is safe here: it runs this file and the script from the default
# branch, never PR code. It checks out nothing from the PR and reads no secret. Its
# token can only re-run Actions jobs and read check annotations. A re-run job runs
# under its own workflow's read-only token, as before.
name: CI runner retry

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun-unacquired:
    name: re-run jobs no runner picked up
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Re-run no-runner jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: .github/scripts/rerun-unacquired.sh
