# TEMPORARY (#558 follow-up, D3 watcher determinism). Removed before the PR is marked ready.
# Repeats the D3 block of test/plugins/sandbox.test.ts in fresh vitest processes under CPU
# load on macOS and Linux, runs main's old version the same way (to show the flake), and the
# flood-disabled mutant (the positive control must fail).
name: D3 repeat (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/d3-repeat-temp.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repeat:
    name: d3 ${{ matrix.variant }} x50 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        variant: [new, old-main]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Allow user namespaces (plugin sandbox network layer)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Use main's test file (old-main only)
        if: matrix.variant == 'old-main'
        run: git show origin/main:test/plugins/sandbox.test.ts > test/plugins/sandbox.test.ts
      - name: Repeat under CPU load
        run: |
          set -uo pipefail
          n=$(getconf _NPROCESSORS_ONLN)
          pids=""
          for i in $(seq 1 "$n"); do (while :; do :; done) & pids="$pids $!"; done
          pass=0; fail=0
          for run in $(seq 1 50); do
            set +e
            NO_COLOR=1 npx vitest run test/plugins/sandbox.test.ts -t "D3" > "run-$run.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && grep -q "7 passed" "run-$run.log"; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              echo "::group::run $run failed (rc $rc)"
              grep -E "FAIL|AssertionError|passed|failed" "run-$run.log" | head -20
              echo "::endgroup::"
            fi
          done
          kill $pids 2>/dev/null || true
          echo "RESULT $VARIANT ${{ matrix.os }}: pass=$pass fail=$fail (cpus=$n)"
          echo "RESULT $VARIANT ${{ matrix.os }}: pass=$pass fail=$fail (cpus=$n)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VARIANT" = new ] && [ "$fail" -ne 0 ]; then exit 1; fi
          exit 0

  mutant:
    name: d3 flood-disabled mutant (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Allow user namespaces (plugin sandbox network layer)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Flood disabled (the hook no longer writes the 64 MiB) and the result assertion removed,
      # so the only thing left to catch the missing flood is the positive control.
      - name: Mutant must fail at the positive control
        run: |
          set -uo pipefail
          node -e '
            const fs = require("node:fs"); const p = "test/plugins/sandbox.test.ts";
            let s = fs.readFileSync(p, "utf8");
            const flood = "for (let i = 0; i < 64; i++) orig.call(this, big);";
            if (s.split(flood).length !== 2) throw new Error("flood line not found once");
            s = s.replace(flood, "/* mutant: no flood */");
            const before = s.length;
            s = s.replace(/^\s*expect\(w\.result\)\.toEqual\(\{ ok: false, code: "PLUGIN_OUTPUT_TOO_LARGE" \}\);\n(?=\s*expect\(w\.seen\))/gm, "");
            if (s.length === before) throw new Error("result assertions not removed");
            fs.writeFileSync(p, s);'
          git diff --stat
          set +e
          NO_COLOR=1 npx vitest run test/plugins/sandbox.test.ts -t "64 MiB|manifest ceiling|manifest floor" > mutant.log 2>&1
          rc=$?
          set -e
          grep -E "FAIL|AssertionError|passed|failed" mutant.log | head -20
          n=$(grep -c "AssertionError: expected [0-9]* to be greater than" mutant.log)
          echo "rc=$rc positive-control failures=$n"
          echo "MUTANT ${{ matrix.os }}: rc=$rc positive-control failures=$n (want rc!=0, 3)" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -ne 0 ] && [ "$n" -eq 3 ]
