[package]
name = "myco-rt-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "In-guest NDJSON control agent for the Myco runtime host-guest channel (RT-004, ADR-0015)"

[[bin]]
name = "myco-rt-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
