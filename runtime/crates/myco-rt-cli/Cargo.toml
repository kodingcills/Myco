[package]
name = "myco-rt-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "myco-rt CLI: the six runtime ops with JSON in/out (ADR-0013)"

[[bin]]
name = "myco-rt"
path = "src/main.rs"

[dependencies]
myco-rt-core = { path = "../myco-rt-core" }
myco-rt-backend-qemu = { path = "../myco-rt-backend-qemu" }
myco-rt-transport = { path = "../myco-rt-transport" }
serde_json = "1"
